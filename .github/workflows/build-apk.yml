# Builds an installable Android APK on GitHub's servers.
# Download it from the "Latest test build" release:
# https://github.com/nosheenfathima02-cmd/Kids-behvaiour/releases/tag/test-build
name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write # to publish the APK as a release

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: Warn if Firebase is not connected yet
        run: |
          if ! grep -q "projectId: .super-mom-" lib/firebase_options.dart; then
            echo "::warning::lib/firebase_options.dart is still the placeholder. The APK installs, but sign-in will not work until the Firebase project is connected (README: Connect your Firebase project)."
          fi
      # Test builds include Google Classroom; store builds hide it with --dart-define=CLASSROOM=false until Google has verified it (store/LAUNCH.md).
      # Without android/key.properties the APK is signed with the shared test key: fine for testing, not for Google Play.
      # Adhan: app/assets/audio/adhan.mp3 plays at Dhuhr, Asr, Maghrib and Isha,
      # adhan_fajr.mp3 at Fajr (Android notification sounds) and in the app.
      - name: Include the adhan recordings if provided
        run: |
          mkdir -p android/app/src/main/res/raw
          DEFINES=""
          if [ -f assets/audio/adhan.mp3 ]; then
            cp assets/audio/adhan.mp3 android/app/src/main/res/raw/adhan.mp3
            DEFINES="$DEFINES --dart-define=ADHAN_SOUND=true"
          fi
          if [ -f assets/audio/adhan_fajr.mp3 ]; then
            cp assets/audio/adhan_fajr.mp3 android/app/src/main/res/raw/adhan_fajr.mp3
            DEFINES="$DEFINES --dart-define=ADHAN_FAJR=true"
          fi
          [ -z "$DEFINES" ] && echo "::notice::No adhan recordings yet, so prayer reminders use the normal notification sound."
          echo "ADHAN_DEFINE=$DEFINES" >> "$GITHUB_ENV"
      # Each build gets its own number, shown in the app (Settings and the welcome screen).
      - run: >-
          flutter build apk --release $ADHAN_DEFINE
          --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}
          --dart-define=BUILD=${{ github.run_number }}
      - name: Publish as the "Latest test build" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="super-mom-build-${{ github.run_number }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build "$APK" --prerelease --target "${{ github.sha }}" \
            --title "Latest test build (build ${{ github.run_number }})" \
            --notes "Tap $APK below to download it on the Android phone, then open it to install. The app shows Version 1.0.${{ github.run_number }} in Settings and at the bottom of the first screen."
      - uses: actions/upload-artifact@v4
        with:
          name: super-mom-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
