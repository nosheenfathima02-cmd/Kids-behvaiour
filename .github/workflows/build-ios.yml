# Checks that the iPhone app builds, on GitHub's Mac machines (no Mac needed).
# Signing and TestFlight upload are added once the Apple Developer account exists.
name: Build iPhone app (check)

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/build-ios.yml']
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --dart-define=CLASSROOM=false
