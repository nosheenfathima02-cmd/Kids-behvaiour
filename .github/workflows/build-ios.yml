# Checks that the iPhone app builds, on GitHub's Mac machines (no Mac needed).
# Signing and TestFlight upload are added once the Apple Developer account exists.
name: Build iPhone app (check)

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/build-ios.yml']
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build (errors are also shown as annotations)
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign --dart-define=CLASSROOM=false 2>&1 | tee build.log || {
            grep -iE "error|exception|requires|minimum|could not|failed" build.log | grep -v "^\s*$" | tail -40 | while IFS= read -r line; do echo "::error::${line:0:400}"; done
            exit 1
          }
